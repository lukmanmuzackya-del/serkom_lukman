<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Batik Nusantara">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#3d2412"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#bg)"/>
  <!-- Kawung center -->
  <ellipse cx="40" cy="40" rx="14" ry="20" fill="none" stroke="#d4af37" stroke-width="2.2"/>
  <ellipse cx="40" cy="40" rx="20" ry="14" fill="none" stroke="#d4af37" stroke-width="1.8" opacity="0.95"/>
  <circle cx="40" cy="40" r="5" fill="#d4af37"/>
  <!-- 4 petal kawung -->
  <ellipse cx="22" cy="22" rx="7" ry="10" fill="none" stroke="#e8d5a3" stroke-width="1.3" opacity="0.7"/>
  <ellipse cx="58" cy="22" rx="7" ry="10" fill="none" stroke="#e8d5a3" stroke-width="1.3" opacity="0.7"/>
  <ellipse cx="22" cy="58" rx="7" ry="10" fill="none" stroke="#e8d5a3" stroke-width="1.3" opacity="0.7"/>
  <ellipse cx="58" cy="58" rx="7" ry="10" fill="none" stroke="#e8d5a3" stroke-width="1.3" opacity="0.7"/>
  <!-- corner dots -->
  <circle cx="14" cy="14" r="2" fill="#d4af37" opacity="0.6"/>
  <circle cx="66" cy="14" r="2" fill="#d4af37" opacity="0.6"/>
  <circle cx="14" cy="66" r="2" fill="#d4af37" opacity="0.6"/>
  <circle cx="66" cy="66" r="2" fill="#d4af37" opacity="0.6"/>
